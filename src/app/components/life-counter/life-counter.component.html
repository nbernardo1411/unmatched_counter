<div class="overlay">
  <h1>Unmatched — Life Tracker</h1>

  <!-- central shared selector -->
  <app-character-selector></app-character-selector>

  <div class="health-container" *ngIf="selected">
    <div class="main-row">
      <div class="title">{{ selected.name }}</div>
      <div class="health-points">{{ selected.health }}</div>
      <div class="controls">
        <button class="button" (click)="inc(selected)">+1</button>
        <button class="button" (click)="dec(selected)">-1</button>
      </div>
    </div>

    <div class="sidekicks" *ngIf="selected.sidekicks?.length">
      <h3>Sidekicks</h3>
      <div class="sidekick" *ngFor="let sk of selected.sidekicks; let i = index">
        <div class="sk-name">{{ sk.name }}</div>
        <div class="sk-health">{{ sk.health }}</div>
        <div class="controls">
          <button class="button" (click)="incSide(selected.name, i)">+1</button>
          <button class="button" (click)="decSide(selected.name, i)">-1</button>
        </div>
      </div>
    </div>

    <div class="sidekick" *ngIf="selected?.uniqueCounter">
      <h3>{{ selected.uniqueCounter.type }}</h3>
      <div class="sk-health">{{ selected.uniqueCounter.value ?? selected.uniqueCounter.start }}</div>
      <div class="controls">
        <button class="button" (click)="incCounter()">+1</button>
        <button class="button" (click)="decCounter()">-1</button>
      </div>
    </div>
  </div>
