<div class="overlay">
  <h1>Unmatched — Life Tracker</h1>

  <!-- shared selector -->
  <app-character-selector></app-character-selector>

  <div class="health-container" *ngIf="selected">

    <!-- main character -->
    <div class="main-row">
      <div class="title">{{ selected.name }}</div>
      <div class="hp-controls">
        <button class="button" (click)="dec(selected)">-</button>
        <div class="health-points">{{ selected.health }}</div>
        <button class="button" (click)="inc(selected)">+</button>
      </div>
    </div>

    <!-- sidekicks -->
    <div class="sidekicks" *ngIf="selected.sidekicks?.length">
      <h3>Sidekicks</h3>
      <div class="sidekick" *ngFor="let sk of selected.sidekicks; let i = index">
        <div class="title">{{ sk.name }}</div>
        <div class="hp-controls">
          <button class="button" (click)="decSide(selected.name, i)">-</button>
          <div class="sk-health">{{ sk.health }}</div>
          <button class="button" (click)="incSide(selected.name, i)">+</button>
        </div>
      </div>
    </div>

    <!-- unique counter -->
    <div class="unique-counter" *ngIf="selected?.uniqueCounter">
      <h3>{{ selected.uniqueCounter.type }}</h3>
      <div class="hp-controls">
        <button class="button" (click)="decCounter()">-</button>
        <div class="sk-health">{{ selected.uniqueCounter.value ?? selected.uniqueCounter.start }}</div>
        <button class="button" (click)="incCounter()">+</button>
      </div>
    </div>

  </div>
</div>
