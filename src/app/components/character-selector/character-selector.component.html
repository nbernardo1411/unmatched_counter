<div class="container">
  <h1>Unmatched — Life Tracker</h1>

  <form>
    <div class="form-group">
      <label>Character</label>
      <p-dropdown 
        [options]="characterList"
        [(ngModel)]="selectedCharacter"
        placeholder="Select character"
        optionLabel="name"
        inputId="character"
        name="character">
      </p-dropdown>
      <small>Choose a character to show health, sidekicks and background.</small>
      <button pButton type="button" label="Cancel" class="p-button-text mt-2" (click)="resetForm()"></button>
    </div>

    <div class="form-group">
      <label>Name</label>
      <input type="text" pInputText [(ngModel)]="name" name="name" placeholder="Enter name" />
    </div>

    <div class="form-group">
      <label>HP</label>
      <input type="number" pInputText [(ngModel)]="hp" name="hp" />
    </div>

    <div class="section">
      <h3>Sidekicks</h3>
      <div *ngFor="let sidekick of sidekicks; let i = index" class="sidekick-group">
        <input type="text" pInputText [(ngModel)]="sidekick.name" placeholder="№" name="sidekick{{i}}Name" />
        <input type="number" pInputText [(ngModel)]="sidekick.hp" name="sidekick{{i}}Hp" />
        <button pButton type="button" label="Remove" class="p-button-danger small-btn" (click)="removeSidekick(i)"></button>
      </div>
      <button pButton type="button" label="+ Add Sidekick" class="p-button-secondary small-btn full-width" (click)="addSidekick()"></button>
    </div>

    <div class="section">
      <h3>Unique Counters</h3>
      <div *ngFor="let counter of counters; let i = index" class="counter-group">
        <input type="number" pInputText [(ngModel)]="counter.value" name="counter{{i}}" />
        <button pButton type="button" label="Remove" class="p-button-danger small-btn" (click)="removeCounter(i)"></button>
      </div>
      <button pButton type="button" label="+ Add Counter" class="p-button-secondary small-btn full-width" (click)="addCounter()"></button>
    </div>

    <button pButton type="button" label="Create" class="p-button-success full-width mt-3" (click)="createCharacter()"></button>
  </form>
</div>
