<div class="select-wrapper" role="region" aria-label="Character selector">
  <label class="select-label" for="character-select">Character</label>

  <div class="select-field">
    <select
      id="character-select"
      class="character-select"
      [value]="selectedName"
      (change)="selectByName($event.target.value)"
      aria-label="Select character"
    >
      <option value="">Select character</option>
      <option *ngFor="let character of characters; trackBy: trackByName" [value]="character.name">
        {{ character.name }}
      </option>
    </select>
    <span class="select-decor" aria-hidden="true"></span>
  </div>

  <!-- Show Edit/Delete only if selected character is custom -->
  <div *ngIf="selectedName && getSelectedCharacter() && isCustomCharacter(getSelectedCharacter())" class="custom-actions">
    <button class="button small" (click)="startEdit(getSelectedCharacter())">Edit</button>
    <button class="button small danger" (click)="deleteCustom(getSelectedCharacter())">Delete</button>
  </div>

  <p class="select-hint" *ngIf="!selectedName">
    Choose a character to show health, sidekicks and background.
  </p>

  <div class="create-toggle">
    <button class="button small" (click)="toggleCreate()">
      {{ showCreate ? 'Cancel' : 'Create custom' }}
    </button>
  </div>

  <div class="create-form" *ngIf="showCreate">
    <label>
      Name
      <input type="text" [(ngModel)]="formName" />
    </label>

    <label>
      HP
      <input type="number" [(ngModel)]="formHp" min="0" />
    </label>

    <label>
      Background image (optional)
      <input type="file" accept="image/*" (change)="onBackgroundFileChange($event)" />
    </label>

    <div class="bg-preview" *ngIf="formBackground">
      <div class="bg-preview-label">Preview</div>
      <img [src]="formBackground" alt="background preview" />
    </div>
  <div class="bg-loading" *ngIf="formBackgroundLoading">Processing image…</div>

    <!-- Sidekick Section -->
    <div class="sidekick-section">
      <h3>Sidekicks</h3>
      <div *ngFor="let s of sidekicks; let i = index" class="sidekick-row">
        <input type="text" placeholder="Name" [(ngModel)]="s.name" />
        <input type="number" placeholder="HP" min="1" [(ngModel)]="s.health" />
        <button type="button" class="button small danger" (click)="removeSidekick(i)">Remove</button>
      </div>
      <button type="button" class="button small full-width" (click)="addSidekick()">+ Add Sidekick</button>
    </div>

    <!-- Unique Counter Section -->
    <div class="unique-section">
      <h3>Unique Counters</h3>
      <div *ngFor="let u of uniqueCounters; let j = index" class="unique-row">
        <input type="text" placeholder="Type" [(ngModel)]="u.type" />
        <input type="number" placeholder="Start" min="0" [(ngModel)]="u.start" />
        <input type="number" placeholder="Max" min="0" [(ngModel)]="u.max" />
        <button type="button" class="button small danger" (click)="removeUniqueCounter(j)">Remove</button>
      </div>
      <button type="button" class="button small full-width" (click)="addUniqueCounter()">+ Add Counter</button>
    </div>

    <!-- Toggles Section -->
    <div class="toggles-section">
      <h3>Toggles</h3>
      <div *ngFor="let t of toggles; let k = index" class="toggle-row">
        <input type="text" placeholder="Toggle name (e.g. Enrage state)" [(ngModel)]="t.name" />
        <label class="switch">
          <input type="checkbox" [(ngModel)]="t.state" />
          <span class="slider"></span>
        </label>
        <button type="button" class="button small danger" (click)="removeToggle(k)">Remove</button>
      </div>
      <button type="button" class="button small full-width" (click)="addToggle()">+ Add Toggle</button>
    </div>

    <div class="actions">
      <button class="button full-width" (click)="createCustom()" [disabled]="formBackgroundLoading">{{ editMode ? 'Save' : 'Create' }}</button>
    </div>
    </div>
  <!-- End create-form -->
