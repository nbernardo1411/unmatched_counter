<div class="select-wrapper" role="region" aria-label="Character selector">
  <label class="select-label" for="character-select">Character</label>

  <div class="select-field">
    <select id="character-select"
            class="character-select"
            [value]="selectedName"
            (change)="selectByName($event.target.value)"
            aria-label="Select character">
      <option value="">Select character</option>
      <option *ngFor="let character of characters; trackBy: trackByName" [value]="character.name">
        {{ character.name }}
      </option>
    </select>

    <span class="select-decor" aria-hidden="true"></span>
  </div>

  <p class="select-hint" *ngIf="!selectedName">
    Choose a character to show health, sidekicks and background.
  </p>

  <div class="create-toggle">
    <button class="button small" (click)="toggleCreate()">
      {{ showCreate ? 'Cancel' : 'Create custom' }}
    </button>
  </div>

  <div class="create-form" *ngIf="showCreate">
    <label> Name <input type="text" [(ngModel)]="formName" /> </label>
    <label> HP <input type="number" [(ngModel)]="formHp" min="0" /> </label>

    <!-- Sidekick Section -->
    <div class="sidekick-section">
      <label>Sidekicks</label>
      <div *ngFor="let s of sidekicks; let i = index" class="sidekick-row">
        <input type="text" placeholder="Name" [(ngModel)]="s.name" />
        <input type="number" placeholder="HP" min="1" [(ngModel)]="s.health" />
        <button type="button" class="button small danger" (click)="removeSidekick(i)">
          Remove
        </button>
      </div>
      <div class="sidekick-actions">
        <button type="button" class="button small" (click)="addSidekick()">+ Add Sidekick</button>
      </div>
    </div>

    <!-- Unique Counter Section -->
    <div class="unique-section">
      <label>Unique Counters</label>
      <div *ngFor="let u of uniqueCounters; let j = index" class="unique-row">
        <input type="text" placeholder="Type" [(ngModel)]="u.type" />
        <input type="number" placeholder="Start" min="0" [(ngModel)]="u.start" />
        <input type="number" placeholder="Max" min="0" [(ngModel)]="u.max" />
        <button type="button" class="button small danger" (click)="removeUniqueCounter(j)">
          Remove
        </button>
      </div>
      <div class="unique-actions">
        <button type="button" class="button small" (click)="addUniqueCounter()">+ Add Counter</button>
      </div>
    </div>

    <div class="actions">
      <button class="button" (click)="createCustom()">Create</button>
    </div>
  </div>
</div>
